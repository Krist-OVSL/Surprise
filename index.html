<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Scan</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  overflow:hidden;
}

#scan{
  font-size:6vw;
}

#troll{
  display:none;
  font-size:12vw;
  animation:rainbow 1s infinite, shake 0.2s infinite;
}

@keyframes rainbow{
  0%{color:red}
  20%{color:orange}
  40%{color:yellow}
  60%{color:lime}
  80%{color:cyan}
  100%{color:magenta}
}

@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(5px,-5px)}
  50%{transform:translate(-5px,5px)}
  75%{transform:translate(5px,5px)}
  100%{transform:translate(0,0)}
}

.progress{
  width:60%;
  height:10px;
  background:#333;
  margin:auto;
  margin-top:20px;
}

.bar{
  height:100%;
  width:0%;
  background:lime;
  animation:load 2s linear forwards;
}

@keyframes load{
  from{width:0%}
  to{width:100%}
}
</style>
</head>

<body>

<div id="scan">
  Scanning device...
  <div class="progress">
    <div class="bar"></div>
  </div>
</div>

<h1 id="troll">YOU'RE GAY</h1>

<audio id="beep" loop>
<source src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Beep-09.wav">
</audio>

<script>
setTimeout(function(){
  document.getElementById("scan").style.display="none";
  document.getElementById("troll").style.display="block";
  document.getElementById("beep").play();

  if(navigator.vibrate){
    setInterval(()=>navigator.vibrate(200),400);
  }

},2000);
</script>

</body>
</html>
